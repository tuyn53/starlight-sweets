<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#19163d">
<title>甜星大作战 · SWEET STAR BLITZ</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="game"></canvas>

<div id="loading" aria-label="游戏入口">
  <h1 class="load-title"><span>甜星<img src="assets/starlight-shard.svg" alt=""></span>大作战</h1>
  <img class="load-art" src="assets/entry/loading-battle.webp" alt="" width="960" height="1440" fetchpriority="high">
  <div class="load-slot">
    <div class="load-meter" id="loadMeter">
      <p class="load-status"><span>正在加载游戏资源</span><b id="loadPct" aria-hidden="true">0%</b></p>
      <div class="load-track" id="loadTrack" role="progressbar" aria-label="游戏资源加载进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <i id="loadFill"></i>
      </div>
      <p class="load-tip">走位躲避怪物，星澜会自动攻击。</p>
    </div>
    <button id="loadStart" class="btn hidden" type="button">进入星光岛 <span aria-hidden="true">→</span></button>
  </div>
</div>

<!-- 左上角全局设置入口：Q 版齿轮，点击弹出设置浮窗（音效/震屏/闪光） -->
<button id="settingsBtn" class="icon-btn" type="button" aria-label="打开设置" aria-haspopup="dialog" aria-controls="settingsPanel" aria-expanded="false">
  <img src="assets/settings-gear.svg" alt="" draggable="false">
</button>

<div id="settingsOverlay" class="settings-overlay hidden">
  <div class="settings-backdrop" id="settingsBackdrop"></div>
  <section id="settingsPanel" class="settings-panel" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
    <div class="settings-head">
      <img class="settings-head-gear" src="assets/settings-gear.svg" alt="" draggable="false">
      <h2 id="settingsTitle">设置</h2>
      <button id="settingsClose" class="settings-close" type="button" aria-label="关闭设置">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></svg>
      </button>
    </div>
    <div class="settings-body">
      <div class="setting-row">
        <span class="setting-icon music" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M8 17V5.6l10-2.2V15"/><circle class="note" cx="5.4" cy="17.4" r="2.8"/><circle class="note" cx="15.4" cy="15" r="2.8"/></svg>
        </span>
        <span class="setting-text"><b>音乐</b><small>可爱的背景循环曲</small></span>
        <button id="musicBtn" class="switch on" type="button" role="switch" aria-checked="true" aria-label="音乐开关"><i></i></button>
      </div>
      <div class="setting-row">
        <span class="setting-icon sound" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M4 9.5v5h3.6l4.4 3.7V5.8L7.6 9.5H4z"/><path class="wave" d="M15.5 9a4.2 4.2 0 0 1 0 6M18 6.6a7.6 7.6 0 0 1 0 10.8"/></svg>
        </span>
        <span class="setting-text"><b>音效</b><small>攻击、拾取与升级声音</small></span>
        <button id="soundBtn" class="switch on" type="button" role="switch" aria-checked="true" aria-label="音效开关"><i></i></button>
      </div>
      <div class="setting-row">
        <span class="setting-icon shake" aria-hidden="true">
          <svg viewBox="0 0 24 24"><rect x="8.5" y="4.5" width="7" height="15" rx="2"/><path class="wave" d="M4 9l-1.5 3L4 15M20 9l1.5 3L20 15"/></svg>
        </span>
        <span class="setting-text"><b>震屏</b><small>命中与受击的镜头反馈</small></span>
        <div id="shakeGroup" class="seg" role="group" aria-label="震屏强度">
          <button type="button" data-val="1">标准</button><button type="button" data-val="0.5">减弱</button><button type="button" data-val="0">关闭</button>
        </div>
      </div>
      <div class="setting-row">
        <span class="setting-icon flash" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M12 3.2l2.1 5.2 5.6.4-4.3 3.6 1.3 5.5L12 15.2l-4.7 2.7 1.3-5.5L4.3 8.8l5.6-.4L12 3.2z"/></svg>
        </span>
        <span class="setting-text"><b>闪光</b><small>技能与升级的亮光效果</small></span>
        <div id="flashGroup" class="seg" role="group" aria-label="闪光强度">
          <button type="button" data-val="1">标准</button><button type="button" data-val="0.5">减弱</button><button type="button" data-val="0">关闭</button>
        </div>
      </div>
    </div>
    <p class="settings-note">设置会自动保存，下次打开依然生效</p>
  </section>
</div>

<div id="hud">
  <div class="hud-top">
    <div class="hud-avatar" aria-label="角色等级">
      <span class="hud-portrait"><img src="assets/characters/xinglan/portrait.webp" alt=""></span>
      <span class="hud-lv">Lv.<b id="hLevel">1</b></span>
    </div>
    <div class="hud-bars">
      <div class="hbar hp" id="hpBar">
        <span class="hbar-ico" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M12 20.6C6.4 16.4 3.2 12.9 3.2 9.3 3.2 6.4 5.4 4.4 8 4.4c1.7 0 3.1.8 4 2.1.9-1.3 2.3-2.1 4-2.1 2.6 0 4.8 2 4.8 4.9 0 3.6-3.2 7.1-8.8 11.3z"/><ellipse class="shine" cx="8.4" cy="8.6" rx="1.7" ry="1.1" transform="rotate(-24 8.4 8.6)"/></svg>
        </span>
        <div class="hbar-track"><i id="hpFill"></i><span class="hbar-text" id="hpText">100 / 100</span></div>
      </div>
      <div class="hbar xp">
        <span class="hbar-ico" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M12 2.8l2.6 5.5 6 .8-4.4 4.2 1.1 5.9L12 16.4l-5.3 2.8 1.1-5.9L3.4 9.1l6-.8L12 2.8z"/><ellipse class="shine" cx="9.3" cy="8.2" rx="1.5" ry="0.9" transform="rotate(-30 9.3 8.2)"/></svg>
        </span>
        <div class="hbar-track" aria-label="经验"><i id="xpFill"></i><span id="xpStatus" class="hbar-text"></span></div>
      </div>
    </div>
    <button id="pauseBtn" class="hud-pause" type="button" aria-label="暂停游戏" title="暂停 / 退出（Esc）">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4.5" y="3" width="5.6" height="18" rx="2.4"/><rect x="13.9" y="3" width="5.6" height="18" rx="2.4"/></svg>
    </button>
  </div>
  <div class="hud-stage">
    <span class="hud-act"><span class="hud-act-icon" id="hActIcon" aria-hidden="true">🌻</span><span id="hActName">阳光草地 · 第 1 关</span></span>
    <div class="hud-stats">
      <div class="hud-stat" aria-label="本关用时">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12.6" r="8.2"/><path d="M12 8v4.9l3.4 2.1"/><path d="M9 2.6h6" /></svg>
        <b id="hTime">00:00</b>
      </div>
      <div class="hud-stat" aria-label="击退数量">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.4c4.4 0 7.6 3 7.6 7.2 0 2.5-1.1 4.3-2.9 5.4l-.4 3.2c-.1.8-.8 1.4-1.6 1.4h-5.4c-.8 0-1.5-.6-1.6-1.4l-.4-3.2c-1.8-1.1-2.9-2.9-2.9-5.4 0-4.2 3.2-7.2 7.6-7.2z"/><circle class="hole" cx="9.2" cy="11" r="1.7"/><circle class="hole" cx="14.8" cy="11" r="1.7"/><path class="hole" d="M11 15.4h2l-1 1.6z"/></svg>
        <b id="hKills">0</b>
      </div>
    </div>
  </div>
  <div id="wpanel"></div>
  <div id="toast"></div>
</div>

<div id="bossbar">
  <div class="name" id="bossName">🌟 草莓大福·莓莓</div>
  <div class="bar boss"><i id="bossFill"></i></div>
</div>

<div id="menu" class="screen home-screen">
  <main class="home-shell" aria-labelledby="gameTitle">
    <header class="home-copy">
      <h1 id="gameTitle">甜星<span>大作战</span></h1>
    </header>
    <div class="hero-area">
      <picture class="hero-character">
        <source media="(prefers-reduced-motion: reduce)" srcset="assets/entry/lobby-still.webp">
        <img src="assets/entry/lobby-idle.webp" width="322" height="319" alt="紫星法师星澜握着星杖">
      </picture>
    </div>
    <div class="home-actions">
      <button class="btn home-play" id="startBtn" type="button">
        <img src="assets/starlight-shard.svg" alt="">
        <span class="play-copy"><strong>开始冒险</strong></span>
        <span aria-hidden="true">→</span>
      </button>
      <p id="menuProgress"></p>
    </div>
  </main>
</div>

<div id="sceneTransition" class="hidden" aria-hidden="true">
  <div class="scene-wrap"><img class="scene-spark" src="assets/starlight-shard.svg" alt=""></div>
</div>

<div id="levels" class="screen hidden">
  <h2>星光岛地图</h2>
  <div class="sub" id="levelSub">已解锁至第 1 关</div>
  <div id="levelGrid"></div>
  <button class="btn ghost" id="backMenuBtn">返回首页</button>
</div>

<div id="levelup" class="screen hidden">
  <div id="rewardVeil" aria-hidden="true"></div>
  <section id="rewardDialog" class="reward-drawer" role="dialog" aria-modal="true" aria-labelledby="upTitle" tabindex="-1">
    <div id="rewardContent">
      <header class="reward-head">
        <h2 id="upTitle">选择强化</h2>
        <p id="upHint" aria-live="polite"></p>
      </header>
      <div id="cards"></div>
      <button id="skipCardBtn" type="button">放弃本次强化</button>
    </div>
    <p id="rewardPeekStatus" aria-live="polite"></p>
    <button id="rewardPeekBtn" type="button" aria-controls="rewardContent" aria-expanded="true">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6-10-6-10-6Z"/><circle cx="12" cy="12" r="2.5"/>
      </svg>
      <span id="rewardPeekLabel">查看战场</span>
    </button>
  </section>
</div>

<div id="result" class="screen hidden">
  <h2 id="resTitle">✨ 通过！</h2>
  <div class="sub" id="resSub">继续下一关吧</div>
  <div class="stats">
    <div>用时 <b id="rTime">00:00</b></div>
    <div>达到等级 <b id="rLevel">1</b></div>
    <div>击退数 <b id="rKills">0</b></div>
  </div>
  <div class="result-build"><span>最终构筑</span><b id="rBuild">—</b></div>
  <div class="result-btns">
    <button class="btn" id="nextBtn">下一关 ➜</button>
    <button class="btn ghost" id="againBtn">重试本关</button>
  </div>
  <button class="btn ghost small" id="resultLevelsBtn">选择关卡</button>
</div>

<!-- 游戏内暂停 / 退出浮窗 -->
<div id="pauseOverlay" class="settings-overlay hidden">
  <div class="settings-backdrop" id="pauseBackdrop"></div>
  <section id="pausePanel" class="settings-panel pause-panel" role="dialog" aria-modal="true" aria-labelledby="pauseTitle">
    <div class="settings-head">
      <span class="settings-head-gear" aria-hidden="true">
        <svg viewBox="0 0 24 24"><rect x="6.5" y="5" width="4" height="14" rx="1.6"/><rect x="13.5" y="5" width="4" height="14" rx="1.6"/></svg>
      </span>
      <h2 id="pauseTitle">休息一下</h2>
    </div>
    <p class="pause-sub" id="hGoal">关底倒计时</p>
    <div class="pause-actions">
      <button class="btn pause-continue" id="pauseContinue" type="button">▶ 继续游戏</button>
      <button class="btn ghost" id="pauseSettings" type="button" aria-haspopup="dialog" aria-controls="settingsPanel" aria-expanded="false">游戏设置</button>
      <button class="btn ghost" id="pauseRestart" type="button">重试本关</button>
      <button class="btn ghost" id="pauseQuit" type="button">退出到选关</button>
    </div>
  </section>
</div>

<script src="js/config.js"></script>
<script src="js/core.js"></script>
<script src="js/music.js"></script>
<script src="js/rig.js"></script>
<script src="js/sprites.js"></script>
<script src="js/slicerig.js"></script>
<script src="js/effects.js"></script>
<script src="js/expansion.js"></script>
<script src="js/logic.js"></script>
<script src="js/tilemap.js"></script>
<script src="js/render.js"></script>
<script src="js/main.js"></script>
</body>
</html>
