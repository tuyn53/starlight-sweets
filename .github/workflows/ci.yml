name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 语法检查
        run: |
          for f in js/*.js scripts/*.js; do
            node --check "$f" || exit 1
          done
          echo "JS syntax OK"

      - name: 逻辑回归
        run: node scripts/smoke_test.js
